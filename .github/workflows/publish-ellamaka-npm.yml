name: Publish Ellamaka npm packages

on:
  push:
    tags:
      - "ellamaka-npm-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact ellamaka-npm tag to retry; select the same tag as the ref"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    if: github.repository == 'wopal-cn/ellamaka'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and validate selected npm packages
        id: selection
        shell: bash
        env:
          RETRY_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "ERROR: a release tag is required" >&2; exit 1
          fi
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "$RETRY_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "ERROR: retry tag must match selected ref" >&2; exit 1
          fi
          tag="$GITHUB_REF_NAME"
          sdk=false
          plugin=false
          version_re='[0-9]+\.[0-9]+\.[0-9]+'
          if [[ "$tag" =~ ^ellamaka-npm-v($version_re)-sdk-v($version_re)-plugin$ ]]; then
            sdk=true; plugin=true; sdk_version="${BASH_REMATCH[1]}"; plugin_version="${BASH_REMATCH[2]}"
          elif [[ "$tag" =~ ^ellamaka-npm-v($version_re)-sdk$ ]]; then
            sdk=true; sdk_version="${BASH_REMATCH[1]}"
          elif [[ "$tag" =~ ^ellamaka-npm-v($version_re)-plugin$ ]]; then
            plugin=true; plugin_version="${BASH_REMATCH[1]}"
          else
            echo "ERROR: invalid package selection tag $tag" >&2; exit 1
          fi
          if $sdk && [ "$(node -p "require('./packages/sdk/js/package.json').version")" != "$sdk_version" ]; then
            echo "ERROR: SDK version does not match tag" >&2; exit 1
          fi
          if $plugin && [ "$(node -p "require('./packages/plugin/package.json').version")" != "$plugin_version" ]; then
            echo "ERROR: Plugin version does not match tag" >&2; exit 1
          fi
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The published contract is generated from the Server composition and
      # committed. A stale generated client or openapi.json would ship a contract
      # that no longer matches the Server, so regeneration must be a no-op.
      - name: Verify the generated SDK contract is up to date
        run: |
          bun run --cwd packages/sdk/js generate
          if ! git diff --exit-code -- packages/sdk/js; then
            echo 'ERROR: the generated SDK contract is stale; run bun run generate in packages/sdk/js and commit it' >&2
            exit 1
          fi

      - name: Verify npm publisher
        working-directory: packages/ellamaka-release
        run: bun test test/npm-publish-*.test.ts

      # Proves the packed artifact, not the source tree: the SDK contract in the
      # tarball must equal the public subset of the Server's complete document,
      # the Official App BFF must stay Server-only, the Worker asset must ship,
      # and no dependency may be an unpublished workspace path.
      - name: Pack, verify the packed contract and clean-install npm packages
        run: |
          args=()
          if [ "${{ steps.selection.outputs.sdk }}" = true ]; then args+=(--package @wopal/ellamaka-sdk); fi
          if [ "${{ steps.selection.outputs.plugin }}" = true ]; then args+=(--package @wopal/ellamaka-plugin); fi
          bun packages/ellamaka-release/src/cli/verify-npm.ts "${args[@]}"

      - uses: actions/setup-node@v6
        with:
          # npm >= 11.5.1 is required for OIDC trusted publishing.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish @wopal/ellamaka-sdk and @wopal/ellamaka-plugin
        run: |
          args=()
          if [ "${{ steps.selection.outputs.sdk }}" = true ]; then args+=(--package @wopal/ellamaka-sdk); fi
          if [ "${{ steps.selection.outputs.plugin }}" = true ]; then args+=(--package @wopal/ellamaka-plugin); fi
          bun packages/ellamaka-release/src/cli/publish-npm.ts "${args[@]}"
