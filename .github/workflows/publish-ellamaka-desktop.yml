name: Publish Ellamaka Desktop

on:
  push:
    tags: ["ellamaka-desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (optional)"
        required: false
        type: string
      channel:
        description: "Desktop build channel"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - beta
      os:
        description: "Target platform(s) to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows
          - mac
          - linux
      publish:
        description: "Publish to R2/CDN and create releases (requires version)"
        required: false
        default: "false"
        type: boolean

# 触发权归 release-cli.sh / release-desktop.sh：一步制 bump 后 push tag（push: tags 触发本
# workflow）；failed attempt 的 re-release 走 workflow_dispatch --ref <tag>。
# Per docs/DISTRIBUTION.md §4.1/§7, releases are immutable: versioned R2
# paths are never cleared, committed releases are never overwritten.
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.repository == 'wopal-cn/ellamaka'
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - name: Derive version
        id: version
        run: |
          # push:tags 事件（release-cli / release-desktop 一步制发布）：版本从 tag 解析，
          # channel 由版本后缀推断（-beta.N → beta），必为正式发布。
          # workflow_dispatch：输入版本（发布/重发/CI dev 共用）。
          if [[ "${{ github.event_name }}" = "push" ]]; then
            version="${GITHUB_REF_NAME#ellamaka-desktop-v}"
            tag="${GITHUB_REF_NAME}"
            release="true"
            if [[ "$version" =~ -beta\.[0-9]+$ ]]; then
              channel="beta"
            else
              channel="stable"
            fi
            matrix='[{"os":"macos-latest","package_cmd":"package:mac --arm64 --x64"},{"os":"windows-latest","package_cmd":"package:win"},{"os":"ubuntu-latest","package_cmd":"package:linux --arm64 --x64"}]'
          else
            if [[ -n "${{ inputs.version }}" ]]; then
              version="${{ inputs.version }}"
              tag="v${version}"
            else
              version="0.0.0-${{ inputs.channel || 'stable' }}.0"
              tag=""
            fi

            # Publishing is explicit: only when the publish input is set AND a
            # version is provided. A version alone no longer implies a release
            # (build.sh CI path passes a dev version with publish=false).
            if [[ "${{ inputs.publish }}" == "true" && -n "${{ inputs.version }}" ]]; then
              release="true"
            else
              release=""
            fi

            if [[ "$version" =~ -beta\.[0-9]+$ ]]; then
              inferred_channel="beta"
            else
              inferred_channel="stable"
            fi

            channel="${{ inputs.channel || 'stable' }}"

            # Fail closed on the channel vocabulary (stable|beta). main/local
            # are local-only build channels: a dispatch with channel=main
            # would build a development identity (scripts/prebuild.ts) and then
            # take the stable publish path below, pushing a dev-identity build
            # to the stable feed with updates disabled. Reject anything outside
            # the publishable vocabulary before building.
            case "$channel" in
              stable|beta) ;;
              *)
                echo "ERROR: invalid channel '${channel}' (expected stable or beta); main/local are local-only and never publishable"
                exit 1
                ;;
            esac

            if [[ "$channel" == "beta" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              echo "ERROR: beta releases require X.Y.Z-beta.N"
              exit 1
            fi
            if [[ "$channel" == "stable" && "$version" == *-beta.* ]]; then
              echo "ERROR: beta versions require channel=beta"
              exit 1
            fi

            # Cross-check the resolved channel against the version-shape-derived
            # channel (X.Y.Z-beta.N → beta, else stable), mirroring the
            # build-env fail-closed rule: an explicit channel contradicting the
            # version shape fails the run before anything is built.
            if [[ "$channel" != "$inferred_channel" ]]; then
              echo "ERROR: channel=${channel} contradicts version ${version} (derived channel: ${inferred_channel}); the release channel is decided by the version shape"
              exit 1
            fi

            # Build matrix: all platforms by default, or a single platform when
            # the os input selects one. release-cli.sh / release-desktop.sh trigger via push tags
            # without the os input, so the default keeps the full matrix.
            case "${{ inputs.os || 'all' }}" in
              windows) matrix='[{"os":"windows-latest","package_cmd":"package:win"}]' ;;
              mac) matrix='[{"os":"macos-latest","package_cmd":"package:mac --arm64 --x64"}]' ;;
              linux) matrix='[{"os":"ubuntu-latest","package_cmd":"package:linux --arm64 --x64"}]' ;;
              *) matrix='[{"os":"macos-latest","package_cmd":"package:mac --arm64 --x64"},{"os":"windows-latest","package_cmd":"package:win"},{"os":"ubuntu-latest","package_cmd":"package:linux --arm64 --x64"}]' ;;
            esac
          fi

          {
            echo "version=${version}"
            echo "release=${release}"
            echo "tag=${tag}"
            echo "channel=${channel}"
            echo "matrix=${matrix}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - name: Validate version matches package.json anchor
        if: steps.version.outputs.release != ''
        run: |
          # 版本真相源 = packages/ellamaka-desktop/package.json
          # （docs/DISTRIBUTION.md §3.2）。tag 版本必须等于锚点文件版本，
          # 防手抖打错 tag 或 dispatch 错版本。
          PKG_VERSION="$(node -e "console.log(require('./packages/ellamaka-desktop/package.json').version)")"
          if [ "${{ steps.version.outputs.version }}" != "$PKG_VERSION" ]; then
            echo "ERROR: release version ${{ steps.version.outputs.version }} does not match packages/ellamaka-desktop/package.json version $PKG_VERSION."
            echo "  Bump the anchor first (scripts/release-desktop.sh), or fix the tag."
            exit 1
          fi
          echo "  version matches packages/ellamaka-desktop/package.json: $PKG_VERSION"

  build-desktop:
    needs: version
    strategy:
      matrix:
        include: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    if: github.repository == 'wopal-cn/ellamaka'
    env:
      ELLAMAKA_CHANNEL: ${{ needs.version.outputs.channel }}
      ELLAMAKA_VERSION: ${{ needs.version.outputs.version }}
      ELLAMAKA_RELEASE: ${{ needs.version.outputs.release }}
      ELLAMAKA_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install

      - name: Generate release context (shared across matrix)
        if: needs.version.outputs.release != ''
        shell: bash
        run: |
          # Per docs/DISTRIBUTION.md §7.1, the release context is assembled
          # from the namespaced tag + upstream lock + github.sha + github.run_id.
          # It is shared across the matrix via artifact.
          bun packages/ellamaka-release/src/cli/context.ts \
            --tag "$GITHUB_REF_NAME" \
            --git-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --output release-context.json

      - name: Upload release context
        if: needs.version.outputs.release != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-context
          path: release-context.json
          if-no-files-found: error

      - name: Verify DSH runtime manifest freshness
        working-directory: packages/ellamaka-desktop
        run: |
          # The packaged sidecar inlines generated/dsh-runtime-manifest.json at
          # bundle time (via the opencode build); the committed manifest must
          # match the source before packaging. Read-only check, fails on drift.
          bun ../ellamaka-cordis/script/generate-dsh-runtime-manifest.ts --check

      - name: Build desktop (electron-vite)
        working-directory: packages/ellamaka-desktop
        env:
          ELLAMAKA_RELEASE_CONTEXT_PATH: ${{ github.workspace }}/release-context.json
        run: bun run build

      - name: Package desktop (electron-builder)
        working-directory: packages/ellamaka-desktop
        env:
          ELLAMAKA_RELEASE_CONTEXT_PATH: ${{ github.workspace }}/release-context.json
        run: bun run ${{ matrix.package_cmd }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            packages/ellamaka-desktop/dist/ellamaka-desktop-*
            packages/ellamaka-desktop/dist/latest*.yml
          if-no-files-found: error

  release:
    needs: [version, build-desktop]
    runs-on: ubuntu-latest
    if: github.repository == 'wopal-cn/ellamaka' && needs.version.outputs.release != ''
    # id-token: write is granted for the npm release step (OIDC trusted
    # publishing); contents: write covers the GitHub release creation below.
    # Scoped to this job so the build matrix never inherits the token grant.
    permissions:
      contents: write
      id-token: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install
        # The npm publish step runs publish-npm.ts, which builds the SDK and
        # plugin packages with the workspace-local tsc. A fresh runner has no
        # node_modules, so dependencies must be installed before any use of
        # the release tooling.

      - name: Download release context
        uses: actions/download-artifact@v8
        with:
          name: release-context
          path: .

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate schema v2 manifest from release context
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            BASE_URL="https://download.coursedao.com/ellamaka-desktop/beta"
          else
            BASE_URL="https://download.coursedao.com/ellamaka-desktop"
          fi
          bun packages/ellamaka-release/src/cli/manifest.ts manifest \
            --archives-dir dist \
            --output-dir release-output \
            --release-context-path release-context.json \
            --base-url "$BASE_URL"

      - uses: actions/setup-node@v6
        if: needs.version.outputs.release != ''
        with:
          # npm >= 11.5.1 is required for OIDC trusted publishing (Node 22
          # ships npm 10.x). setup-node writes the .npmrc registry block only
          # when registry-url is set — required for the OIDC exchange.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # No npm cache: caching would expose the OIDC auth token to a
          # poisoned cache restore.
          package-manager-cache: false

      - name: Publish npm packages (@wopal/ellamaka-sdk, @wopal/ellamaka-plugin)
        # A desktop release bumps the whole workspace to the base version
        # (scripts/lib/release.sh mirrors every dependency package to the pure
        # base), so the engine's plugin pin needs the branded packages on npm
        # even when no CLI release runs in between. Same shared publish CLI as
        # the CLI workflow: it owns the idempotency probe and the
        # prerelease-free version check.
        #
        # Runs BEFORE the R2 commit point below: the versioned R2 manifest is
        # the immutable release commit and a re-run cannot overwrite it, so a
        # failed npm publish must abort the release before it is committed. The
        # publish CLI is idempotent — it skips a version already on the
        # registry — so a dispatch re-run fills the gap instead of failing.
        #
        # The version is passed through raw: a desktop beta tag
        # (2.0.6-beta.1) maps to the base package version (2.0.6), stripped
        # exactly once inside the publish CLI; the base version must match both
        # packages or the step fails before touching the registry. Publishing
        # order is sdk first, plugin second (the plugin depends on the sdk,
        # incl. /v2). The step repeats the job's release gate so the npm
        # contract stays self-describing if the job condition is ever widened.
        if: needs.version.outputs.release != ''
        run: |
          bun packages/ellamaka-release/src/cli/publish-npm.ts \
            --version "${{ needs.version.outputs.version }}"

      - name: Upload binaries and metadata to Cloudflare R2
        run: |
          R2_URL="https://${R2_ENDPOINT}"
          if [ "$CHANNEL" = "beta" ]; then
            R2_ROOT="ellamaka-desktop/beta"
          else
            R2_ROOT="ellamaka-desktop"
          fi
          VERSION_PREFIX="${R2_ROOT}/v${VERSION}"
          LATEST_PREFIX="${R2_ROOT}/latest"

          # Per docs/DISTRIBUTION.md §7.1: versioned R2 paths are immutable.
          # If an effective manifest already exists at the target path, fail
          # closed — do not clear, overwrite, or proceed.
          EXISTING_MANIFEST=$(aws s3api head-object \
            --bucket wopal-release \
            --key "${VERSION_PREFIX}/manifest.json" \
            --endpoint-url "$R2_URL" 2>/dev/null || echo "")
          if [ -n "$EXISTING_MANIFEST" ]; then
            echo "ERROR: effective manifest already exists at ${VERSION_PREFIX}/manifest.json"
            echo "Committed releases are immutable. Use a higher version, or whole-version withdrawal."
            exit 1
          fi
          echo "No existing manifest at ${VERSION_PREFIX} — proceeding."

          put_with_cache() {
            local file="$1" key="$2" cache="$3" ct="$4"
            for attempt in 1 2 3; do
              if aws s3api put-object \
                --bucket wopal-release \
                --key "$key" \
                --body "$file" \
                --content-type "$ct" \
                --cache-control "$cache" \
                --endpoint-url ${R2_URL} >/dev/null; then
                break
              fi
              echo "  put-object attempt $attempt failed for $(basename "$file")"
              if [ "$attempt" -eq 3 ]; then
                echo "ERROR: put-object failed after 3 attempts: $(basename "$file")"
                exit 1
              fi
              sleep 5
            done
          }

          # Versioned upload is driven by the manifest (the declaration),
          # never by dist globs: the uploaded set equals the declared set by
          # construction. Blockmaps stay out of the versioned prefix (they
          # are updater assets, §7.1).
          echo "Uploading versioned artifacts (declared set)..."
          while IFS=$'\t' read -r name ext; do
            ct="application/octet-stream"
            case "$ext" in
              dmg) ct="application/x-apple-diskimage" ;;
              zip) ct="application/zip" ;;
              deb) ct="application/vnd.debian.binary-package" ;;
            esac
            put_with_cache "dist/${name}" "${VERSION_PREFIX}/${name}" "public, max-age=2592000, immutable" "$ct"
          done < <(node -e '
            const m = JSON.parse(require("fs").readFileSync("release-output/manifest.json","utf8"));
            for (const a of m.artifacts) console.log([a.name, a.ext].join("\t"));
          ')

          # Updater feeds and blockmaps are part of the release record:
          # versioning them lets whole-version withdrawal restore a healthy
          # latest channel (manifest + feeds + updater assets). Without this,
          # a withdrawn latest version leaves dangling feeds that cannot be
          # rebuilt (electron-builder generates them only at build time).
          for feed in latest-mac.yml latest.yml latest-linux.yml; do
            if [ -f "dist/${feed}" ]; then
              put_with_cache "dist/${feed}" "${VERSION_PREFIX}/${feed}" "public, max-age=2592000, immutable" "application/x-yaml"
              echo "  uploaded versioned feed: ${VERSION_PREFIX}/${feed}"
            else
              echo "  WARNING: feed not found, skipping: dist/${feed}"
            fi
          done

          for f in dist/ellamaka-desktop-*.blockmap; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            put_with_cache "$f" "${VERSION_PREFIX}/${name}" "public, max-age=2592000, immutable" "application/octet-stream"
          done

          # Metadata — manifest is written LAST as the release commit point.
          put_with_cache "release-output/checksums.txt" "${VERSION_PREFIX}/checksums.txt" "public, max-age=2592000, immutable" "text/plain"
          put_with_cache "release-output/release-notes.md" "${VERSION_PREFIX}/release-notes.md" "public, max-age=2592000, immutable" "text/markdown"
          put_with_cache "release-output/manifest.json" "${VERSION_PREFIX}/manifest.json" "public, max-age=2592000, immutable" "application/json"

          # Verify: every declared artifact must exist remotely with the
          # manifest size; full hash re-check on mismatch. Iterates the
          # manifest (the declaration), never local dist files — a dist file
          # absent from the manifest can no longer fake a mismatch via empty
          # array lookups (the aarch64.rpm failure mode).
          echo "Verifying R2 uploads against manifest..."
          declare -A manifest_sha manifest_size
          while IFS=$'\t' read -r mname msha msize; do
            if [ -z "$msha" ] || [ -z "$msize" ]; then
              echo "ERROR: manifest artifact missing sha256/size: $mname"
              exit 1
            fi
            manifest_sha["$mname"]="$msha"
            manifest_size["$mname"]="$msize"
          done < <(node -e '
            const m = JSON.parse(require("fs").readFileSync("release-output/manifest.json","utf8"));
            for (const a of m.artifacts) console.log([a.name, a.sha256, a.size].join("\t"));
          ')
          while IFS=$'\t' read -r name ext; do
            key="${VERSION_PREFIX}/${name}"
            remote_size=$(aws s3api head-object \
              --bucket wopal-release \
              --key "$key" \
              --endpoint-url ${R2_URL} \
              --query 'ContentLength' \
              --output text 2>/dev/null || echo "0")
            expected_size="${manifest_size[$name]}"
            if [ "$remote_size" != "$expected_size" ]; then
              echo "  size mismatch ($name): manifest=$expected_size remote=$remote_size — full hash verify"
              VERIFY_DIR="$(mktemp -d)"
              aws s3api get-object \
                --bucket wopal-release \
                --key "$key" \
                --endpoint-url ${R2_URL} \
                "${VERIFY_DIR}/${name}" >/dev/null
              remote_hash="$(sha256sum "${VERIFY_DIR}/${name}" | cut -d' ' -f1)"
              expected_hash="${manifest_sha[$name]}"
              if [ "$remote_hash" != "$expected_hash" ]; then
                echo "ERROR: R2 checksum mismatch: $name"
                echo "  manifest sha256: $expected_hash"
                echo "  remote   sha256: $remote_hash"
                exit 1
              fi
              rm -rf "$VERIFY_DIR"
              echo "  OK: $name (sha256=$remote_hash size=$remote_size) [full verify]"
            else
              echo "  OK: $name (size=$remote_size) [head-only]"
            fi
          done < <(node -e '
            const m = JSON.parse(require("fs").readFileSync("release-output/manifest.json","utf8"));
            for (const a of m.artifacts) console.log([a.name, a.ext].join("\t"));
          ')

          # Latest promotion runs only after versioned verification passes,
          # so a failed verify can never point the latest channel at a broken
          # release (previously the aliases were written before verify).
          put_with_cache "release-output/manifest.json" "${LATEST_PREFIX}/manifest.json" "public, max-age=60" "application/json"
          echo "  promoted latest manifest: ${LATEST_PREFIX}/manifest.json"

          for f in dist/ellamaka-desktop-*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            case "$name" in
              *.zip|*.exe|*.AppImage|*.zip.blockmap|*.exe.blockmap) ;;
              *) continue ;;
            esac
            ct="application/octet-stream"
            case "$name" in
              *.zip) ct="application/zip" ;;
            esac
            put_with_cache "$f" "${LATEST_PREFIX}/${name}" "public, max-age=60" "$ct"
          done

          for feed in latest-mac.yml latest.yml latest-linux.yml; do
            if [ -f "dist/${feed}" ]; then
              put_with_cache "dist/${feed}" "${LATEST_PREFIX}/${feed}" "public, max-age=60" "application/x-yaml"
              echo "  promoted feed: ${LATEST_PREFIX}/${feed}"
            else
              echo "  WARNING: feed not found, skipping: dist/${feed}"
            fi
          done

          echo "R2 upload complete for ellamaka-desktop v${VERSION}"

      - name: Purge Cloudflare CDN cache
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_CACHE_PURGE_ZONE: ${{ secrets.CLOUDFLARE_CACHE_PURGE_ZONE }}
        run: |
          if [ -z "${CLOUDFLARE_CACHE_PURGE_TOKEN:-}" ] || [ -z "${CLOUDFLARE_CACHE_PURGE_ZONE:-}" ]; then
            echo "ERROR: CDN purge credentials are required for release publishing."
            exit 1
          fi

          if [ "$CHANNEL" = "beta" ]; then
            CDN_ROOT="https://download.coursedao.com/ellamaka-desktop/beta"
          else
            CDN_ROOT="https://download.coursedao.com/ellamaka-desktop"
          fi
          VERSION_BASE="${CDN_ROOT}/v${VERSION}"
          LATEST_BASE="${CDN_ROOT}/latest"
          PURGE_URLS=(
            "${LATEST_BASE}/manifest.json"
            "${LATEST_BASE}/latest-mac.yml"
            "${LATEST_BASE}/latest.yml"
            "${LATEST_BASE}/latest-linux.yml"
            "${VERSION_BASE}/manifest.json"
            "${VERSION_BASE}/checksums.txt"
            "${VERSION_BASE}/release-notes.md"
          )

          for f in dist/ellamaka-desktop-*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            case "$name" in
              *.zip|*.exe|*.AppImage|*.zip.blockmap|*.exe.blockmap)
                PURGE_URLS+=("${LATEST_BASE}/${name}")
                ;;
            esac
          done

          mapfile -t PURGE_URLS < <(printf '%s\n' "${PURGE_URLS[@]}" | sort -u)
          for ((offset=0; offset<${#PURGE_URLS[@]}; offset+=30)); do
            batch=("${PURGE_URLS[@]:offset:30}")
            payload=$(printf '%s\n' "${batch[@]}" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => input += chunk);
              process.stdin.on("end", () => {
                const files = input.split(/\r?\n/).filter(Boolean);
                process.stdout.write(JSON.stringify({ files }));
              });
            ')
            response="${RUNNER_TEMP}/purge-response-${offset}.json"
            code=$(curl -sS -o "$response" -w "%{http_code}" \
              -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_CACHE_PURGE_ZONE}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload")
            if [ "$code" != "200" ] || ! node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).success ? 0 : 1)' "$response"; then
              echo "ERROR: Cloudflare purge failed (HTTP $code)."
              exit 1
            fi
          done
          echo "CDN purge complete for ellamaka-desktop v${VERSION}"

      - name: Warmup Cloudflare CDN cache for release artifacts
        continue-on-error: true
        env:
          CHANNEL: ${{ needs.version.outputs.channel }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            CDN_ROOT="https://download.coursedao.com/ellamaka-desktop/beta"
          else
            CDN_ROOT="https://download.coursedao.com/ellamaka-desktop"
          fi
          echo "Verifying CDN serves the new version before warmup..."
          # The `latest` alias has a 60s CDN TTL. Confirm the published
          # manifest is actually served before warming the big binaries;
          # otherwise a stale edge would be refreshed back into the cache.
          VERIFIED=0
          for i in $(seq 1 12); do
            SERVED_VERSION=$(curl -s -L -H "User-Agent: WopalReleaseVerify/1.0" "${CDN_ROOT}/latest/manifest.json" | node -e '
              let raw = "";
              process.stdin.on("data", (c) => raw += c);
              process.stdin.on("end", () => {
                try { process.stdout.write(JSON.parse(raw).version || ""); } catch { /* invalid JSON */ }
              });
            ')
            if [ -n "$SERVED_VERSION" ] && [ "$SERVED_VERSION" = "$VERSION" ]; then
              VERIFIED=1
              echo "  OK: ${CDN_ROOT}/latest/manifest.json serves v${SERVED_VERSION}"
              break
            fi
            echo "  retry $i/12: served v${SERVED_VERSION:-unknown}, waiting for v${VERSION}..."
            sleep 5
          done
          if [ "$VERIFIED" != "1" ]; then
            echo "WARN: latest manifest did not converge to v${VERSION} within 60s — skipping warmup"
            exit 0
          fi
          echo "Warming up CDN cache for ellamaka-desktop v${VERSION} (${CHANNEL})..."
          WARMUP_URLS=(
            "${CDN_ROOT}/latest/manifest.json"
            "${CDN_ROOT}/v${VERSION}/manifest.json"
          )
          while IFS= read -r url; do
            [ -n "$url" ] && WARMUP_URLS+=("$url")
          done < <(node -e '
            const m = JSON.parse(require("fs").readFileSync("release-output/manifest.json","utf8"));
            for (const a of m.artifacts) console.log(a.url);
          ')

          for url in "${WARMUP_URLS[@]}"; do
            echo "Pre-fetching: $url"
            curl -s -L -X GET -H "User-Agent: WopalReleaseWarmup/1.0" --range 0-1048576 -o /dev/null "$url" || true
          done
          echo "CDN cache warmup complete."

      - name: Create ellamaka GitHub release (idempotent create, no overwrite)
        if: needs.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          version="$VERSION"
          tag="ellamaka-desktop-v${version}"
          if gh release view "$tag" --repo wopal-cn/ellamaka >/dev/null 2>&1; then
            echo "Release $tag already exists — committed releases are immutable, skipping (no edit/overwrite)."
          else
            gh release create "$tag" \
              --repo wopal-cn/ellamaka \
              --title "ellamaka-desktop v${version}" \
              --notes-file release-output/release-notes.md
            echo "Created ellamaka release $tag"
          fi

      - name: Create ontology GitHub release (idempotent create)
        if: needs.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RELEASE_TOKEN secret is required to publish the ontology GitHub release."
            exit 1
          fi

          version="$VERSION"
          tag="ellamaka-desktop-v${version}"
          if gh release view "$tag" --repo wopal-cn/wopal-space-ontology >/dev/null 2>&1; then
            echo "Release $tag already exists — committed releases are immutable, skipping."
          else
            gh release create "$tag" \
              --repo wopal-cn/wopal-space-ontology \
              --title "ellamaka-desktop v${version}" \
              --notes-file release-output/release-notes.md
            echo "Created ontology release $tag"
          fi

      - name: Create ellamaka Gitee release (idempotent create)
        if: needs.version.outputs.release != ''
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.RELEASE_GITEE }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun packages/ellamaka-release/src/cli/gitee.ts --version "$VERSION" --repo wopal-cn/ellamaka --tag ellamaka-desktop-v"$VERSION" --product-name "ellamaka-desktop" --notes-file release-output/release-notes.md

      - name: Create ontology Gitee release (idempotent create)
        if: needs.version.outputs.release != ''
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.RELEASE_GITEE }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun packages/ellamaka-release/src/cli/gitee.ts \
            --version "$VERSION" \
            --repo wopal-cn/wopal-space-ontology \
            --tag ellamaka-desktop-v"$VERSION" \
            --product-name "ellamaka-desktop" \
            --notes-file release-output/release-notes.md

      - name: Summary
        if: always()
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            CDN_ROOT="https://download.coursedao.com/ellamaka-desktop/beta"
          else
            CDN_ROOT="https://download.coursedao.com/ellamaka-desktop"
          fi
          {
            echo "## Ellamaka Desktop Release Distribution"
            echo ""
            echo "- Channel: ${CHANNEL}"
            echo "- R2 (CDN): ${CDN_ROOT}/v${VERSION}/"
            echo "- Updater feed (latest): ${CDN_ROOT}/latest/"
            echo "- GitHub (ontology): https://github.com/wopal-cn/wopal-space-ontology/releases/tag/ellamaka-desktop-v${VERSION}"
            echo "- Gitee (ontology): https://gitee.com/wopal-cn/wopal-space-ontology/releases/tag/ellamaka-desktop-v${VERSION}"
          } >> $GITHUB_STEP_SUMMARY

  # Post-publish retention cleanup: runs only after the release job fully
  # succeeded (R2 commit point + release pages), so it can never race a
  # in-flight release. Fires on EVERY publish path (script tag push, self-heal
  # re-point, manual dispatch). Retention: newest 2 stable + 2 beta per
  # channel; latest-alias releases are always protected; registry orphans
  # (R2 deleted, release left behind) are swept.
  cleanup:
    name: Retention cleanup (2 stable + 2 beta)
    needs: [release]
    runs-on: ubuntu-latest
    if: github.repository == 'wopal-cn/ellamaka' && needs.release.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Run retention cleanup (apply)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITEE_TOKEN: ${{ secrets.RELEASE_GITEE }}
        run: |
          bun packages/ellamaka-release/src/cli/cleanup.ts --product ellamaka-desktop --keep-stable 2 --keep-beta 2
