name: CI

# Nightly + manual only. This repository deliberately does not run the test
# suite on push or pull requests: CI minutes are limited by an explicit
# product decision, and merges are not gated on this workflow. Packaging has
# its own release gate in the publish workflows.
on:
  schedule:
    # 18:00 UTC = 02:00 Asia/Shanghai.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  checks:
    name: Install, typecheck, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe DSH grep descriptors
        working-directory: packages/opencode
        run: |
          bun test test/cli/cmd/tui/dsh-mount.test.ts -t 'executes grep'

      - name: Typecheck
        run: bun run typecheck

      # Fast static gate: no test may add a process-wide module replacement, a
      # bare environment mutation, a fixed-delay wait, a live I/O call in the
      # unit layer, or a new skip/todo. Runs before the slow suites so a
      # regression is reported in seconds rather than minutes.
      - name: Test isolation policy
        run: bun run check:test-isolation

      # The gate has its own tests: a broken gate must fail loudly rather
      # than silently pass everything.
      - name: Test isolation gate tests
        run: bun run test:isolation-gate

      - name: Lint
        run: bun run lint

      # Behavioural order check: the same suite must pass with the test files
      # loaded forwards, backwards, and in the two-file combinations that share
      # state. A suite that only passes in one order is order-dependent.
      - name: Test order isolation
        run: bun run --cwd packages/ellamaka-app check:test-order-isolation

      # Each invocation starts with a cold module/provider cache. Every run
      # must pass; this is a regression check, never a retry-until-green.
      - name: DSH grep cold-process regression
        working-directory: packages/opencode
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "DSH grep cold process $attempt/8"
            bun test test/cli/cmd/tui/dsh-mount.test.ts -t 'executes grep' || exit 1
          done

      # Every package that ships a test:ci script runs it through the
      # existing turbo task (turbo.json already declares its JUnit output).
      - name: Unit tests
        run: bunx turbo run test:ci

  slow:
    name: DSH tool tests (real system sandbox)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The DSH tool tests exercise the real OS sandbox. Preparing and probing
      # it first means a host without confinement fails here instead of the
      # tool tests silently degrading to unconfined execution.
      - name: Prepare and probe DSH sandbox
        run: bash scripts/ci/prepare-dsh-sandbox.sh

      - name: Run DSH tool tests
        run: bun run --cwd packages/ellamaka-cordis test:tools
