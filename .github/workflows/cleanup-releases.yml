name: Clean up releases

# Independent release cleanup workflow. Per docs/DISTRIBUTION.md §7.2,
# cleanup uses the protection model: latest/updater-referenced releases are
# always protected; only standard SemVer releases within the same
# product/channel become retention candidates; legacy/unknown objects fail
# closed (retained, never auto-deleted). Whole-version withdrawal (§9.2) is
# a separate explicit mode that requires the version to be recorded in
# release/withdrawn-versions.json, restores aliases to a healthy fallback,
# purges CDN, then deletes the versioned path, Release page and tag.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "retention | withdraw"
        required: true
        type: choice
        default: retention
        options:
          - retention
          - withdraw
      product:
        description: "ellamaka-cli | ellamaka-desktop"
        required: true
        type: choice
        options:
          - ellamaka-cli
          - ellamaka-desktop
      apply:
        description: "Apply deletions (default: dry-run plan only)"
        required: false
        type: boolean
        default: false
      keep-stable:
        description: "Number of stable releases to keep (retention mode)"
        required: false
        type: string
        default: "3"
      keep-beta:
        description: "Number of beta releases to keep (desktop retention only)"
        required: false
        type: string
        default: "2"
      keep-rc:
        description: "Number of CLI rc releases to keep (cli retention only)"
        required: false
        type: string
        default: "2"
      withdraw-version:
        description: "Version to withdraw (withdraw mode, must be in withdrawn-versions.json)"
        required: false
        type: string
      fallback-version:
        description: "Healthy fallback version (withdraw mode, required)"
        required: false
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.repository == 'wopal-cn/ellamaka'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Run cleanup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITEE_TOKEN: ${{ secrets.RELEASE_GITEE }}
        run: |
          PRODUCT="${{ inputs.product }}"
          MODE="${{ inputs.mode }}"
          if [ "$MODE" = "retention" ]; then
            if [ "${{ inputs.apply }}" = "true" ]; then
              DRY_FLAG=""
            else
              DRY_FLAG="--dry-run"
            fi
            if [ "$PRODUCT" = "ellamaka-cli" ]; then
              bun packages/ellamaka-release/src/cli/cleanup.ts --product ellamaka-cli --keep-stable "${{ inputs.keep-stable }}" --keep-rc "${{ inputs.keep-rc }}" $DRY_FLAG
            else
              bun packages/ellamaka-release/src/cli/cleanup.ts --product ellamaka-desktop --keep-stable "${{ inputs.keep-stable }}" --keep-beta "${{ inputs.keep-beta }}" $DRY_FLAG
            fi
          else
            # Withdraw mode: real execution (R2 + GitHub + Gitee mutation).
            # Per §9.2, the version must already be recorded in
            # release/withdrawn-versions.json before this run.
            WITHDRAW_VER="${{ inputs.withdraw-version }}"
            FALLBACK_VER="${{ inputs.fallback-version }}"
            if [ -z "$WITHDRAW_VER" ] || [ -z "$FALLBACK_VER" ]; then
              echo "ERROR: withdraw mode requires withdraw-version and fallback-version"
              exit 2
            fi
            if [ "${{ inputs.apply }}" = "true" ]; then
              DRY_FLAG=""
            else
              DRY_FLAG="--dry-run"
            fi
            if [ "$PRODUCT" = "ellamaka-cli" ]; then
              bun packages/ellamaka-release/src/cli/cleanup.ts --product ellamaka-cli --withdraw "$WITHDRAW_VER" --fallback "$FALLBACK_VER" $DRY_FLAG
            else
              bun packages/ellamaka-release/src/cli/cleanup.ts --product ellamaka-desktop --withdraw "$WITHDRAW_VER" --fallback "$FALLBACK_VER" $DRY_FLAG
            fi
          fi
      - name: Purge withdrawn version from Cloudflare CDN
        if: inputs.mode == 'withdraw' && inputs.apply && inputs.withdraw-version != ''
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_CACHE_PURGE_ZONE: ${{ secrets.CLOUDFLARE_CACHE_PURGE_ZONE }}
          WITHDRAW_VER: ${{ inputs.withdraw-version }}
          FALLBACK_VER: ${{ inputs.fallback-version }}
        run: |
          if [ -z "${CLOUDFLARE_CACHE_PURGE_TOKEN:-}" ] || [ -z "${CLOUDFLARE_CACHE_PURGE_ZONE:-}" ]; then
            echo "WARN: CDN purge credentials missing — withdrawn version remains cached until TTL expiry."
            exit 0
          fi

          if [ "${{ inputs.product }}" = "ellamaka-cli" ]; then
            ROOT="ellamaka"
          else
            ROOT="ellamaka-desktop"
            # Desktop beta releases live under beta/ in R2 and CDN.
            if [[ "${WITHDRAW_VER}" == *-beta.* ]]; then
              ROOT="${ROOT}/beta"
            fi
          fi

          PURGE_URLS=(
            "https://download.coursedao.com/${ROOT}/v${WITHDRAW_VER}/manifest.json"
            "https://download.coursedao.com/${ROOT}/v${WITHDRAW_VER}/checksums.txt"
            "https://download.coursedao.com/${ROOT}/v${WITHDRAW_VER}/release-notes.md"
            "https://download.coursedao.com/${ROOT}/latest/manifest.json"
            "https://download.coursedao.com/${ROOT}/latest/latest-mac.yml"
            "https://download.coursedao.com/${ROOT}/latest/latest.yml"
            "https://download.coursedao.com/${ROOT}/latest/latest-linux.yml"
          )

          # Artifact files are versioned objects too; derive their names from
          # the healthy fallback manifest (same product/channel artifact set)
          # and swap in the withdrawn version. Latest-prefix updater copies
          # (zip/exe/AppImage + blockmaps) are restored from the same
          # fallback objects during withdrawal and must be purged as well.
          FALLBACK_MANIFEST_URL="https://download.coursedao.com/${ROOT}/v${FALLBACK_VER}/manifest.json"
          curl -sS -o "${RUNNER_TEMP}/fallback-manifest.json" "$FALLBACK_MANIFEST_URL" || true
          if [ -s "${RUNNER_TEMP}/fallback-manifest.json" ]; then
            while IFS= read -r artifact_url; do
              swapped="${artifact_url//v${FALLBACK_VER}/v${WITHDRAW_VER}}"
              PURGE_URLS+=("$swapped" "${swapped}.blockmap")
            done < <(node -e '
              const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              for (const a of m.artifacts || []) if (a.url) console.log(a.url);
            ' "${RUNNER_TEMP}/fallback-manifest.json")
            while IFS= read -r name; do
              PURGE_URLS+=("https://download.coursedao.com/${ROOT}/latest/${name}" "https://download.coursedao.com/${ROOT}/latest/${name}.blockmap")
            done < <(node -e '
              const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              for (const a of m.artifacts || []) {
                if (a.ext === "zip" || a.ext === "exe" || a.ext === "AppImage") console.log(a.name);
              }
            ' "${RUNNER_TEMP}/fallback-manifest.json")
          fi

          for ((offset=0; offset<${#PURGE_URLS[@]}; offset+=30)); do
            batch=("${PURGE_URLS[@]:offset:30}")
            payload=$(printf '%s\n' "${batch[@]}" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => input += chunk);
              process.stdin.on("end", () => {
                const files = input.split(/\r?\n/).filter(Boolean);
                process.stdout.write(JSON.stringify({ files }));
              });
            ')
            response="${RUNNER_TEMP}/withdraw-purge-response-${offset}.json"
            code=$(curl -sS -o "$response" -w "%{http_code}" \
              -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_CACHE_PURGE_ZONE}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload")
            if [ "$code" != "200" ] || ! node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).success ? 0 : 1)' "$response"; then
              echo "ERROR: Cloudflare purge failed (HTTP $code)."
              exit 1
            fi
          done
          echo "CDN purge complete for ${ROOT} v${WITHDRAW_VER}"